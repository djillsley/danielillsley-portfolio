<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" rx="12" fill="#262626"/>
  <rect x="0.5" y="0.5" width="799" height="399" rx="11.5" stroke="#404040"/>

  <!-- Flow Lines (Paths) -->
  <path d="M100 200 H700" stroke="#404040" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Retention Stages -->
  <!-- Stage 1: Welcome -->
  <rect x="50" y="150" width="140" height="100" rx="8" fill="#171717" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="195" fill="#f5f5f5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Welcome</text>
  <text x="120" y="215" fill="#22c55e" font-family="Arial" font-size="12" text-anchor="middle">Email Sequence</text>
  
  <!-- Arrow 1 -->
  <path d="M190 200 L230 200" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 2: Engagement -->
  <rect x="230" y="150" width="140" height="100" rx="8" fill="#171717" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="195" fill="#f5f5f5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Engagement</text>
  <text x="300" y="215" fill="#22c55e" font-family="Arial" font-size="12" text-anchor="middle">Push & SMS</text>
  
  <!-- Arrow 2 -->
  <path d="M370 200 L410 200" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 3: Conversion -->
  <rect x="410" y="150" width="140" height="100" rx="8" fill="#171717" stroke="#22c55e" stroke-width="2"/>
  <text x="480" y="195" fill="#f5f5f5" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Conversion</text>
  <text x="480" y="215" fill="#22c55e" font-family="Arial" font-size="12" text-anchor="middle">WhatsApp Biz</text>
  
  <!-- Arrow 3 -->
  <path d="M550 200 L590 200" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 4: Retention -->
  <rect x="590" y="150" width="140" height="100" rx="8" fill="#22c55e" stroke="#22c55e" stroke-width="2"/>
  <text x="660" y="195" fill="#171717" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">LTV Growth</text>
  <text x="660" y="215" fill="#171717" font-family="Arial" font-size="12" text-anchor="middle">Predictive AI</text>

  <!-- Waterfall Drops (Churn Visualization) -->
  <path d="M120 250 V320" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="120" cy="325" r="3" fill="#ef4444"/>
  <text x="120" y="345" fill="#a3a3a3" font-family="Arial" font-size="10" text-anchor="middle">Drop-off</text>
  
  <path d="M300 250 V320" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="300" cy="325" r="3" fill="#ef4444"/>
  
  <path d="M480 250 V320" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="480" cy="325" r="3" fill="#ef4444"/>

  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>
  
  <!-- Label -->
  <text x="40" y="40" fill="#a3a3a3" font-family="Arial" font-size="12" font-weight="bold">STRATEGIC RETENTION WATERFALL v1.0</text>
</svg>